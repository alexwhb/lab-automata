8-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/spacegrotesk/v22/V8mDoQDjQSkFtoMM3T6r8E7mPb94C_k3HqUtEw.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e4dcf189-0db9-4204-ac11-fa84eee93430\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#0A0A0A}\n.paper{background-color:#0A0A0A;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);background-size:60px 60px,60px 60px,12px 12px,12px 12px}\na{color:#4CC3F0}a:hover{color:#8AD8F5}\n.lbl{font:600 11px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#A3A3A3}\n.card{border:1px solid #242424;border-radius:10px;background:rgba(17,17,17,0.84);padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"paper\" style=\"width: 1440px; min-height: 640px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; gap: 24px; color: #EAEAEA; font-family: Inter, system-ui, sans-serif\">\n  <div style=\"display: flex; flex-direction: column; gap: 8px\">\n    <span class=\"lbl\">SPICE-for-X series · fourth bench<\u002Fspan>\n    <h1 style=\"margin: 0; font: 600 36px/1.1 'Space Grotesk', Inter, sans-serif; letter-spacing: -0.02em\">Same family, one new accent<\u002Fh1>\n    <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #D9D9D9; max-width: 880px\">Shares the greys, grid ground, header and 2.5D bench. Adds one magenta ramp, a cell-age scale and cell-glyph icons.<\u002Fp>\n  <\u002Fdiv>\n\n  <section aria-label=\"App identities\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px\">\n    <sc-for list=\"{{apps}}\" as=\"a\" hint-placeholder-count=\"4\">\n      <div class=\"card\" style=\"border-color: {{a.edge}}\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <span style=\"width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid {{a.acc}}; background: #171717; display: flex; align-items: center; justify-content: center\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: {{a.acc}}\"><\u002Fspan><\u002Fspan>\n          <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0\">\n            <span style=\"font: 600 17px 'Space Grotesk', Inter, sans-serif\">{{a.name}}<\u002Fspan>\n            <span style=\"font-size: 12px; color: #A3A3A3\">{{a.domain}}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid {{a.edge}}; color: {{a.ink}}; background: {{a.tint}}\">{{a.tag}}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n          <sc-for list=\"{{a.ramp}}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <span style=\"height: 36px; border-radius: 6px; background: {{c.hex}}; border: 1px solid #2E2E2E\"><\u002Fspan>\n              <span style=\"font-size: 11px; color: #D9D9D9\">{{c.role}}<\u002Fspan>\n              <span style=\"font: 400 10.5px 'JetBrains Mono', monospace; color: #A3A3A3\">{{c.hex}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px\">\n    <section class=\"card\" aria-label=\"Cell-age scale\">\n      <span class=\"lbl\" style=\"color: #F9B3E8\">Cell-age scale · automata only<\u002Fspan>\n      <div style=\"display: flex; gap: 10px; align-items: flex-end\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center\"><span style=\"width: 40px; height: 40px; border-radius: 8px; background: #FFE6F7; box-shadow: 0 6px 0 #B34E9C, 0 0 16px rgba(255,170,232,.7)\"><\u002Fspan><span style=\"font-size: 11px; color: #D9D9D9; margin-top: 6px\">Newborn<\u002Fspan><span style=\"font: 400 10.5px 'JetBrains Mono', monospace; color: #A3A3A3\">#FFE6F7<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center\"><span style=\"width: 40px; height: 40px; border-radius: 8px; background: #F06BD0; box-shadow: 0 6px 0 #8A2F76\"><\u002Fspan><span style=\"font-size: 11px; color: #D9D9D9; margin-top: 6px\">Alive<\u002Fspan><span style=\"font: 400 10.5px 'JetBrains Mono', monospace; color: #A3A3A3\">#F06BD0<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center\"><span style=\"width: 40px; height: 40px; border-radius: 8px; background: #B24C9C; box-shadow: 0 6px 0 #561C49\"><\u002Fspan><span style=\"font-size: 11px; color: #D9D9D9; margin-top: 6px\">Elder<\u002Fspan><span style=\"font: 400 10.5px 'JetBrains Mono', monospace; color: #A3A3A3\">#B24C9C<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center\"><span style=\"width: 40px; height: 40px; border-radius: 8px; background: #3B1734\"><\u002Fspan><span style=\"font-size: 11px; color: #D9D9D9; margin-top: 6px\">Trail<\u002Fspan><span style=\"font: 400 10.5px 'JetBrains Mono', monospace; color: #A3A3A3\">#3B1734<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; align-items: center\"><span style=\"width: 40px; height: 40px; border-radius: 8px; background: #1B1C21; border: 1px solid #2E2E2E; box-sizing: border-box\"><\u002Fspan><span style=\"font-size: 11px; color: #D9D9D9; margin-top: 6px\">Empty<\u002Fspan><span style=\"font: 400 10.5px 'JetBrains Mono', monospace; color: #A3A3A3\">#1B1C21<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size: 12px; line-height: 1.5; color: #A3A3A3\">Reads in greyscale too. Live cells lift 6 px off the tray.<\u002Fspan>\n    <\u002Fsection>\n\n    <section class=\"card\" aria-label=\"Shared with the series\">\n      <span class=\"lbl\">Shared, unchanged<\u002Fspan>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #D9D9D9; line-height: 1.45\">\n        <span>Neutrals, grid ground, tilted bench<\u002Fspan>\n        <span>Header, mode switch, app switcher, Run · Step<\u002Fspan>\n        <span>Parts palette (here: rules and stamps)<\u002Fspan>\n        <span>Advanced mode as a netlist-style script<\u002Fspan>\n        <span>Space Grotesk, Inter, JetBrains Mono<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"card\" aria-label=\"Icon family\" style=\"border-color: #6B2A5C\">\n      <span class=\"lbl\" style=\"color: #F9B3E8\">Icon family · cell glyphs<\u002Fspan>\n      <div style=\"display: flex; gap: 10px\">\n        <sc-for list=\"{{icons}}\" as=\"ic\" hint-placeholder-count=\"5\">\n          <span style=\"width: 48px; height: 48px; border: 1px solid #242424; border-radius: 8px; background: #111111; display: flex; align-items: center; justify-content: center\"><svg width=\"27\" height=\"27\" sc-camel-view-box=\"0 0 27 27\" aria-hidden=\"true\"><path d=\"{{ic.grey}}\" fill=\"#3A3A3A\"><\u002Fpath><path d=\"{{ic.on}}\" fill=\"#F06BD0\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-size: 12px; line-height: 1.5; color: #A3A3A3\">3 × 3 cell grids: grey empty, magenta live.<\u002Fspan>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:640}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const ramp = (a, i, t, e) => [{ role: 'Accent', hex: a }, { role: 'Ink', hex: i }, { role: 'Tint', hex: t }, { role: 'Edge', hex: e }];\n    const apps = [\n      { name: 'Breadbox', domain: 'Circuits · SPICE', tag: 'existing', acc: '#F2A33A', ink: '#F7C77A', tint: '#1D1810', edge: '#6B4A16', ramp: ramp('#F2A33A', '#F7C77A', '#1D1810', '#6B4A16') },\n      { name: 'Chem Playground', domain: 'Reactions · kinetics', tag: 'existing', acc: '#86A2FF', ink: '#B3C4FF', tint: '#161C2E', edge: '#3B4C7A', ramp: ramp('#86A2FF', '#B3C4FF', '#161C2E', '#3B4C7A') },\n      { name: 'Bio Playground', domain: 'Gene circuits · populations', tag: 'existing', acc: '#4BE3A0', ink: '#A6F5CF', tint: '#0E2419', edge: '#1E5C42', ramp: ramp('#4BE3A0', '#A6F5CF', '#0E2419', '#1E5C42') },\n      { name: 'Automata Playground', domain: 'Cellular automata · rules', tag: 'new', acc: '#F06BD0', ink: '#F9B3E8', tint: '#22101D', edge: '#6B2A5C', ramp: ramp('#F06BD0', '#F9B3E8', '#22101D', '#6B2A5C') }\n    ];\n    const cell = (x, y) => 'M' + (1 + x * 9) + ' ' + (1 + y * 9) + 'h7v7h-7z';\n    const icon = (onList) => {\n      let grey = '', on = '';\n      for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) { if (onList.some((p) => p[0] === x && p[1] === y)) on += cell(x, y); else grey += cell(x, y); }\n      return { grey, on };\n    };\n    const icons = [\n      icon([[1, 0], [2, 1], [0, 2], [1, 2], [2, 2]]),\n      icon([[0, 1], [1, 1], [2, 1]]),\n      icon([[0, 0], [1, 0], [0, 1], [1, 1]]),\n      icon([[0, 0], [1, 0], [2, 0], [0, 1], [2, 1], [0, 2], [1, 2], [2, 2]]),\n      icon([[0, 0], [2, 0], [0, 2], [2, 2]])\n    ];\n    return { apps, icons };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
