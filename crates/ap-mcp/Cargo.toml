[package]
name = "ap-mcp"
description = "The Automata Playground MCP server `automata-mcp` (stdio): engine tools in-process on ap-engine, app tools on the running app over the live bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ap_mcp"
path = "src/lib.rs"

[[bin]]
name = "automata-mcp"
path = "src/main.rs"

[dependencies]
ap-engine = { workspace = true }
ap-shared = { workspace = true }
lab-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"

[dev-dependencies]
# The end-to-end tests run the real app in an egui_kittest harness next to the real binary.
automata-playground = { path = "../automata-playground" }
egui_kittest = { workspace = true }
eframe = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
