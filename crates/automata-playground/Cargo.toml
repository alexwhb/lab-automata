[package]
name = "automata-playground"
description = "Automata Playground — a cellular-automata playground and rule lab (macOS app): app shell, navigation, widgets and screens."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "automata-playground"

[lib]
name = "automata_playground"
path = "src/lib.rs"

[[bin]]
name = "automata-playground"
path = "src/main.rs"

[dependencies]
ap-theme = { workspace = true }
lab-theme = { workspace = true }
lab-ui = { workspace = true }
eframe = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
rfd = "0.18.0"

[dev-dependencies]
egui_kittest = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
